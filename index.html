<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f0">
<title>amrita.town — campus map & search</title>
<meta name="description" content="A multi-floor map of Amrita Vishwa Vidyapeetam, Bengaluru — buildings, rooms, canteens and walking routes.">
<link rel="icon" href="/favicon.png">
<script>
  // auto-first: the scheme follows the operating system unless this browser has
  // been told otherwise. Runs before first paint so a visitor never sees a
  // flash of the wrong scheme.
  try {
    var t = localStorage.getItem('campusmap.theme')
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t)
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark')
    }
    document.querySelector('meta[name="theme-color"]').content =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '#181818' : '#faf7f0'
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark')
  }
</script>
</head>
<body>
  <div id="map" aria-label="campus map"></div>

  <header id="bar">
    <button id="open-search" type="button" aria-label="search campus">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M10.5 10.5 L14.2 14.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span class="ph">search rooms, places, canteens…</span>
      <kbd>⌘K</kbd>
    </button>
    <button id="layers-btn" type="button" aria-expanded="false" aria-controls="layers">
      <span class="dots" aria-hidden="true"></span>
      <span class="n"></span>
    </button>
    <button id="sat-btn" type="button" aria-label="toggle satellite imagery" title="satellite" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="8" cy="8" r="1.4" fill="currentColor"/>
      </svg>
    </button>
    <button id="draw-btn" type="button" aria-label="toggle draw mode" title="draw" aria-pressed="false" disabled>
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <path d="M11.6 2.3a1.7 1.7 0 0 1 2.1 2.1l-6.6 6.6-2.8.7.7-2.8 6.6-6.6z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
        <path d="M3 13.2h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="theme-btn" type="button" aria-label="change theme" title="theme: auto"></button>
  </header>

  <!-- One stack, so the filter buttons can wrap to any number of rows
       without ever colliding with the footer below them. -->
  <div id="dock">
    <nav id="layers" aria-label="map layers">
      <div class="layers-head">
        <span class="t">layers</span>
        <button type="button" data-all>all</button>
        <button type="button" data-none>none</button>
        <button type="button" class="layers-close" aria-label="close layers">&times;</button>
      </div>
      <div id="layer-filters"></div>
    </nav>
    <footer id="foot">
      <a class="src" href="https://github.com/amritadottown/map.amrita.town" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>github.com/amritadottown/map.amrita.town</span>
      </a>
    </footer>
  </div>

  <div id="attrib">
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
    <a href="https://github.com/amritadottown/map.amrita.town" target="_blank" rel="noopener">map data</a>
    <a id="sat-attrib" href="https://www.esri.com/en-us/legal/terms/full-master-agreement" target="_blank" rel="noopener" hidden>Imagery: Esri, Maxar, Earthstar Geographics</a>
  </div>

  <section id="panel" hidden aria-live="polite"></section>

  <div id="palette" hidden role="dialog" aria-modal="true" aria-label="search campus">
    <div id="palette-box">
      <div id="palette-input-row">
        <span id="palette-glyph" aria-hidden="true">›</span>
        <input id="palette-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="go"
               placeholder="room 203 · canteen · main gate · water …"
               aria-label="search campus" aria-controls="palette-results" aria-expanded="true">
        <span id="palette-timing" aria-hidden="true"></span>
        <button id="palette-close" type="button" aria-label="close search">&times;</button>
      </div>
      <div id="palette-results" role="listbox"></div>
      <footer id="palette-foot">
        <span class="hint"><kbd>↑↓</kbd> move</span>
        <span class="hint"><kbd>↵</kbd> open</span>
        <span class="hint"><kbd>tab</kbd> route</span>
        <a id="palette-repo" href="https://github.com/amritadottown/map.amrita.town" target="_blank" rel="noopener">contribute</a>
        <span id="palette-count"></span>
      </footer>
    </div>
  </div>

  <div id="draw-toolbar" hidden></div>

  <div id="boot">loading campus…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
